let filter='all',query='',mode='1120';
function openDetail(index){const item=items[index];document.getElementById('detail-label').textContent=`灵感 ${String(index+1).padStart(2,'0')} / ${item.label}`;document.getElementById('detail-title').textContent=item.title;document.getElementById('detail-description').textContent=item.description;const image=document.getElementById('detail-image');image.src=item.image;image.alt=item.title;document.getElementById('detail-technical').textContent=index===4?'原始尺寸 400 × 1400 · 展示比例 16:10 · object-fit: cover':'完整标题已展开 · 无空格文本自动换行 · 图片按固定比例裁切';dialog.showModal();}
function render(){grid.replaceChildren();let count=0;items.forEach((item,index)=>{if(filter!=='all'&&item.category!==filter)return;if(query&&!`${item.title} ${item.description} ${item.label}`.toLowerCase().includes(query))return;count++;const card=document.createElement('article');card.className='card';card.dataset.index=String(index+1);const visual=document.createElement('div');visual.className='visual';const image=document.createElement('img');image.src=item.image;image.alt=['绿色几何图形设计手册','阳光下的层叠拱门','蓝色字体排印样张','陶土、沙色与苔绿配色样张','纵向庭院的拱门局部','淡紫色模块化版式'][index];visual.append(image);const tag=document.createElement('span');tag.className='image-tag';tag.textContent=item.tag;visual.append(tag);const number=document.createElement('span');number.className='image-number';number.textContent=String(index+1).padStart(2,'0');visual.append(number);const content=document.createElement('div');content.className='card-content';const category=document.createElement('div');category.className='category';category.textContent=item.en;const title=document.createElement('h2');title.textContent=item.title;title.title=item.title;const description=document.createElement('p');description.className='description';description.textContent=item.description;const bottom=document.createElement('div');bottom.className='card-bottom';const id=document.createElement('span');id.className='card-index';id.textContent=`NO. ${String(index+1).padStart(2,'0')}`;const button=document.createElement('button');button.className='detail-button';button.textContent='查看详情 ↗';button.setAttribute('aria-label',`查看灵感 ${index+1} 完整标题及详情`);button.addEventListener('click',()=>openDetail(index));bottom.append(id,button);content.append(category,title,description,bottom);card.append(visual,content);grid.append(card);});if(!count){const empty=document.createElement('div');empty.className='empty';empty.textContent='没有找到相关灵感，试试其他关键词。';grid.append(empty);}document.getElementById('result-count').replaceChildren(document.createTextNode('精选目录 · '));const total=document.createElement('strong');total.textContent=`${count} 个灵感`;document.getElementById('result-count').append(total);measure();}
function measure(){const columns=getComputedStyle(grid).gridTemplateColumns.split(' ').filter(Boolean).length;document.getElementById('grid-status').textContent=`${Math.round(grid.getBoundingClientRect().width)} px / ${columns} 列 · 间距 24 px`;}
function setWidth(value){mode=value;grid.style.maxWidth=value==='auto'?'100%':`${value}px`;range.disabled=value==='auto';widthValue.textContent=value==='auto'?'自适应':`${value} px`;if(value!=='auto')range.value=value;document.querySelectorAll('[data-width]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.width===value)));measure();}
range.addEventListener('input',()=>setWidth(range.value));document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>setWidth(button.dataset.width)));document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{filter=button.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));render();}));document.getElementById('search').addEventListener('input',event=>{query=event.target.value.trim().toLowerCase();render();});dialog.querySelector('.close').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',event=>{if(event.target!==dialog)return;const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close();});new ResizeObserver(measure).observe(grid);render();
</script>
</body>
</html>
