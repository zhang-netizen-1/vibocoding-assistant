<div class="canvas"><span class="ctl">一个按钮的 12 种状态（固定展示）</span>
        <section class="ds-states-panel"><header class="ds-states-heading"><strong>每一次操作，都有回应</strong><p>从默认到完成，查看同一按钮的完整状态。</p></header><div class="states-grid">
          <div class="st-cell"><button class="st-btn">默认</button><div class="st-lbl">default</div></div>
          <div class="st-cell"><button class="st-btn hv">悬停</button><div class="st-lbl">:hover</div></div>
          <div class="st-cell"><button class="st-btn ac">按下</button><div class="st-lbl">:active</div></div>
          <div class="st-cell"><button class="st-btn pr">长按</button><div class="st-lbl">pressed</div></div>
          <div class="st-cell"><button class="st-btn fc">聚焦</button><div class="st-lbl">:focus</div></div>
          <div class="st-cell"><button class="st-btn sel">✓ 选中</button><div class="st-lbl">selected</div></div>
          <div class="st-cell"><button class="st-btn dis" disabled>禁用</button><div class="st-lbl">:disabled</div></div>
          <div class="st-cell"><button class="st-btn ro">只读</button><div class="st-lbl">readonly</div></div>
          <div class="st-cell"><button class="st-btn ld"><i class="st-spin" aria-hidden="true"></i>加载中</button><div class="st-lbl">loading</div></div>
          <div class="st-cell"><button class="st-btn suc">✓ 成功</button><div class="st-lbl">success</div></div>
          <div class="st-cell"><button class="st-btn err">! 错误</button><div class="st-lbl">error</div></div>
          <div class="st-cell"><button class="st-btn warn">! 警告</button><div class="st-lbl">warning</div></div>
        </div></section>
</div>
