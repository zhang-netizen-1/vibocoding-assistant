  --ds-r-stage:16px; --ds-r-surface:16px; --ds-r-panel:12px; --ds-r-control:8px; --ds-r-chip:6px; --ds-r-min:6px;

@view-transition { navigation:auto; }
* { box-sizing:border-box; min-width:0; }
body { margin:0; padding:16px; background:var(--ds-surface); color:var(--ds-ink); font:400 14px/1.6 var(--ds-font); overflow-wrap:anywhere; }
header,p { margin:0; color:var(--ds-ink-2); font:400 12px/1.5 var(--ds-font); }
h1 { margin:8px 0 16px; color:var(--ds-ink); font:600 20px/1.4 var(--ds-font); }
a { color:var(--ds-accent); text-decoration:none; }
a:focus-visible { outline:2px solid var(--ds-accent); outline-offset:2px; }
a:active { background:var(--ds-accent-50); }
.grid { display:grid; grid-template-columns:minmax(0,1fr); gap:16px; }
.tile { display:block; width:100%; border:1px solid var(--ds-line); border-radius:var(--ds-r-min); overflow:hidden; background:var(--ds-surface); color:var(--ds-ink); box-shadow:var(--ds-shadow-1); }
.art { position:relative; display:block; width:100%; height:180px; overflow:hidden; background:var(--ds-fill); view-transition-name:featured-image; }
.art img { width:100%; height:100%; display:block; object-fit:cover; }
.tile b { display:flex; align-items:center; min-height:44px; padding:10px 12px; font:500 14px/1.5 var(--ds-font); }
.tile+.tile { display:grid; grid-template-columns:80px minmax(0,1fr); }
.tile+.tile .art { height:72px; view-transition-name:none; }
.back { display:inline-flex; align-items:center; min-height:44px; margin-bottom:16px; }
.detail-art { height:220px; border:1px solid var(--ds-line); border-radius:var(--ds-r-min); }
@media(max-width:239px) { body { padding:12px; } .art { height:140px; } .tile+.tile { grid-template-columns:56px minmax(0,1fr); } h1 { font-size:16px; } }
@media(prefers-reduced-motion:reduce) { ::view-transition-old(*),::view-transition-new(*) { animation:none!important; } }
