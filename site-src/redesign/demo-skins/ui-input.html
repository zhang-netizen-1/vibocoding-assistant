<div class="canvas ds-input-demo">
  <div class="ds-surface ds-input-panel">
    <div class="ds-input-field">
      <label class="ds-input-label" for="demo-profile-name">姓名</label>
      <input class="i" id="demo-profile-name" type="text" aria-label="姓名" placeholder="请输入姓名" autocomplete="name">
    </div>
    <label class="floatfield" for="demo-profile-email">
      <input class="i" id="demo-profile-email" type="text" placeholder=" " aria-label="邮箱" autocomplete="email">
      <span class="fflabel">邮箱</span>
    </label>
    <p class="ds-input-note">用于接收项目邀请与更新通知。</p>
  </div>
  <span class="ctl ds-hint">点击输入框，体验聚焦与浮动标签</span>
</div>
