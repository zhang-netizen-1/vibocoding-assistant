<div class="stage " data-effect="extra-shrink-header"><span class="stage-label">在卡片内滚动</span><div class="extra-scene header-scroll-scene ds-i2-panel"><div class="extra-heading ds-i2-heading"><strong>收缩页头</strong><p class="ds-i2-meta">栖居设计手记 · 第12期</p></div><div class="extra-scroll extra-header-scroll" tabindex="0" aria-label="滚动观察页头压缩"><div class="extra-scroll-header"><strong>设计中的<br>细节观察</strong><span>阅读约 3 分钟</span></div><div class="extra-article-copy"><h4>从整体到细节</h4><p>内容经过页头时，空间逐渐收紧，导航仍留在可见位置。</p><p>继续向下阅读，标题保留为简短的定位信息。</p><p>页面结构保持稳定，阅读的上下文不会丢失。</p><p>向上滚动，页头就会恢复原来的宽松形态。</p></div></div></div></div>
