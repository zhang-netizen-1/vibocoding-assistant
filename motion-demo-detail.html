<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>作品详情 · 转场演示</title>
<style>
@view-transition{navigation:auto}
*{box-sizing:border-box}body{margin:0;padding:11px;background:#f8fafb;color:#29465b;font:11px/1.4 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
a{color:#2f6288;text-decoration:none;font-size:10px}a:focus-visible{outline:2px solid #2c63b5;outline-offset:2px}
.art{height:91px;margin-top:7px;position:relative;overflow:hidden;border-radius:9px;background:radial-gradient(circle at 71% 24%,#ffe3ad 0 9%,transparent 10%),linear-gradient(160deg,transparent 0 54%,#2d6272 55% 75%,#244960 76%),linear-gradient(#8fc8d0,#f5cfb0);view-transition-name:featured-image}
.art:after{content:"";position:absolute;left:-20px;bottom:-15px;width:90px;height:45px;border-radius:50%;background:#4c8b87;transform:rotate(-14deg)}
h1{font-size:14px;margin:7px 0 1px}p{font-size:9px;color:#6f8796;margin:0}
@media(prefers-reduced-motion:reduce){::view-transition-old(*),::view-transition-new(*){animation-duration:.001ms!important}}
</style>
</head>
<body><a href="motion-demo-gallery.html">← 返回画廊</a><div class="art" role="img" aria-label="山间日落插画"></div><h1>山间日落</h1><p>同一张图片，从列表衔接到详情页。</p></body>
</html>
